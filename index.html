<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <title>Dance Player — for classes</title>
    <meta
      name="description"
      content="Pick a local audio file, optional countdown, and start from a fixed second."
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="assets/icons/icon-512.png" />
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#2563eb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Dance Player" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="stylesheet" href="assets/styles/main.css" />
  </head>
  <body>
    <div class="shell">
      <header class="brand">
        <div class="brand-top">
          <div class="brand-copy">
            <div class="brand-name" data-i18n="brand_name">Dance Player</div>
          </div>
          <div class="lang-wrap">
            <select
              id="lang-select"
              class="lang-select j-lang-select"
              autocomplete="off"
              data-i18n-attr="aria-label:lang_aria"
            >
              <option value="en">English</option>
              <option value="el">Ελληνικά</option>
              <option value="ru">Русский</option>
            </select>
          </div>
        </div>
      </header>

      <main class="card">
        <section class="track-panel" data-i18n-attr="aria-label:track_panel_aria">
          <div class="track-panel__hero">
            <input
              id="audio-file"
              type="file"
              accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.webm,.flac"
              data-i18n-attr="aria-label:pick_file_aria"
            />
            <div class="track-panel__art" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z" />
              </svg>
            </div>
            <div class="track-panel__info">
              <div class="track-panel__name" id="track-name"></div>
              <div class="track-panel__meta tabular" id="track-meta"></div>
            </div>
            <button
              type="button"
              class="btn-secondary btn-with-ico track-panel__change"
              id="pick-file-btn"
              data-i18n-attr="aria-label:pick_file_button_aria"
            >
              <svg
                class="btn-ico"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M3 7V5a2 2 0 012-2h3l2 2h7a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V7z" />
              </svg>
              <span data-i18n="pick_file">Change</span>
            </button>
          </div>

          <div class="transport transport--idle" id="transport">
            <div class="transport-scrub">
              <span id="time-current" class="transport-time tabular">0:00</span>
              <div class="transport-track-shell">
                <div
                  class="transport-track"
                  id="transport-track"
                  role="slider"
                  tabindex="-1"
                  style="--transport-pct: 0%"
                  data-i18n-attr="aria-label:transport_track_aria"
                  aria-valuemin="0"
                  aria-valuemax="100"
                  aria-valuenow="0"
                  aria-valuetext=""
                >
                  <div class="transport-bar-rail">
                    <div class="transport-bar" aria-hidden="true">
                      <div class="transport-fill" id="transport-fill"></div>
                    </div>
                    <span class="transport-thumb" aria-hidden="true"></span>
                  </div>
                </div>
              </div>
              <span id="time-duration" class="transport-time tabular">0:00</span>
            </div>
            <div class="transport-actions transport-actions--compact">
              <div class="transport-actions__seek">
                <div class="transport-actions__cluster transport-actions__cluster--left">
                  <button
                    type="button"
                    class="btn-tiny btn-tiny--seek"
                    id="btn-seek-back"
                    disabled
                    data-i18n-attr="aria-label:seek_back_aria"
                  >
                    <span class="btn-tiny__delta tabular" data-i18n="seek_back_short">-5</span>
                  </button>
                </div>
                <button type="button" class="btn-tiny btn-tiny--main btn-play-pause" id="btn-play-pause" disabled data-mode="play">
                  <span class="btn-play-pause__face btn-play-pause__face--play">
                    <svg
                      class="btn-ico btn-ico--play"
                      width="24"
                      height="24"
                      viewBox="0 0 24 24"
                      fill="currentColor"
                      aria-hidden="true"
                    >
                      <path d="M8 5v14l11-7L8 5z" />
                    </svg>
                  </span>
                  <span class="btn-play-pause__face btn-play-pause__face--pause">
                    <svg
                      class="btn-ico"
                      width="22"
                      height="22"
                      viewBox="0 0 24 24"
                      fill="currentColor"
                      aria-hidden="true"
                    >
                      <rect x="8" y="5" width="3" height="14" rx="1.5" />
                      <rect x="13" y="5" width="3" height="14" rx="1.5" />
                    </svg>
                  </span>
                </button>
                <div class="transport-actions__cluster transport-actions__cluster--right">
                  <button
                    type="button"
                    class="btn-tiny btn-tiny--seek"
                    id="btn-seek-fwd"
                    disabled
                    data-i18n-attr="aria-label:seek_fwd_aria"
                  >
                    <span class="btn-tiny__delta tabular" data-i18n="seek_fwd_short">+5</span>
                  </button>
                  <button type="button" class="btn-tiny btn-tiny--stop" id="btn-stop" data-i18n-attr="aria-label:btn_stop">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                      <rect x="7" y="7" width="10" height="10" rx="1.5" />
                    </svg>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </section>

        <div class="field row-2">
          <div class="row-2__section row-2__section--start">
            <div class="start-picker" id="start-picker">
              <div class="start-picker__head">
                <div class="start-picker__line">
                  <label class="start-picker__label" for="start-sec">
                    <span data-i18n="start_short_label">Start</span><span class="start-picker__colon" aria-hidden="true">:</span>
                  </label>
                  <div
                    class="start-time-field"
                    id="start-time-field"
                    role="group"
                    aria-valuemin="0"
                    aria-valuemax="3600"
                    aria-valuenow="0"
                    aria-valuetext="0:00"
                    data-i18n-attr="aria-label:field_start_sec"
                  >
                    <div class="time-roller-readout-sr tabular" id="start-readout-sr">0:00</div>
                    <input
                      id="start-sec"
                      class="start-time-input"
                      type="text"
                      inputmode="numeric"
                      enterkeyhint="done"
                      autocomplete="off"
                      autocorrect="off"
                      autocapitalize="off"
                      spellcheck="false"
                      value="0:00"
                      disabled
                      tabindex="-1"
                      data-i18n-attr="title:start_manual_input_title"
                    />
                  </div>
                </div>
                <button
                  type="button"
                  class="btn-set-current"
                  id="btn-set-start-current"
                  disabled
                  data-i18n-attr="aria-label:btn_set_current_aria"
                >
                  <svg
                    class="btn-set-current__ico"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.85"
                    stroke-linecap="round"
                    aria-hidden="true"
                  >
                    <circle cx="12" cy="12" r="6" />
                    <path d="M12 5v2M12 17v2M5 12h2M17 12h2" />
                  </svg>
                  <span data-i18n="btn_set_current">Set current</span>
                </button>
              </div>
            </div>
          </div>
          <div class="row-2__section row-2__section--delay">
            <div class="delay-picker" role="group" aria-labelledby="delay-picker-heading">
              <span id="delay-picker-heading" class="delay-picker__label">
                <span data-i18n="delay_short_label">Countdown</span><span class="delay-picker__colon" aria-hidden="true">:</span>
              </span>
              <div id="delay-chips" class="delay-picker__chips" role="radiogroup" aria-labelledby="delay-picker-heading">
                <button type="button" class="delay-chip delay-chip--selected" role="radio" aria-checked="true" data-delay="0" data-i18n="delay_chip_none">
                  None
                </button>
                <button type="button" class="delay-chip" role="radio" aria-checked="false" tabindex="-1" data-delay="3" data-i18n="delay_chip_3">
                  3s
                </button>
                <button type="button" class="delay-chip" role="radio" aria-checked="false" tabindex="-1" data-delay="5" data-i18n="delay_chip_5">
                  5s
                </button>
                <button type="button" class="delay-chip" role="radio" aria-checked="false" tabindex="-1" data-delay="8" data-i18n="delay_chip_8">
                  8s
                </button>
                <button type="button" class="delay-chip" role="radio" aria-checked="false" tabindex="-1" data-delay="10" data-i18n="delay_chip_10">
                  10s
                </button>
              </div>
            </div>
          </div>
        </div>
      </main>

      <div
        class="countdown countdown--stage"
        id="countdown-stage"
        aria-live="polite"
        aria-atomic="true"
      >
        <div class="countdown__idle" id="countdown-idle">
          <p class="countdown__hint" data-i18n="hint_countdown">After you start — countdown</p>
        </div>
        <div class="countdown__active" id="countdown-active" hidden>
          <div class="countdown__header">
            <span class="countdown__header-rule" aria-hidden="true"></span>
            <span class="countdown__heading" data-i18n="countdown_starting_in">Starting in</span>
            <span class="countdown__header-rule" aria-hidden="true"></span>
          </div>
          <div class="countdown__body">
            <div class="countdown__ring-shell">
              <svg class="countdown__ring" viewBox="0 0 120 120" aria-hidden="true">
                <defs>
                  <linearGradient id="countdown-ring-grad" x1="60" y1="120" x2="60" y2="0" gradientUnits="userSpaceOnUse">
                    <stop class="countdown-stop-a" offset="0%" />
                    <stop class="countdown-stop-b" offset="100%" />
                  </linearGradient>
                </defs>
                <circle class="countdown__ring-track" cx="60" cy="60" r="52" fill="none" pathLength="100" />
                <circle
                  class="countdown__ring-progress"
                  id="countdown-ring-progress"
                  cx="60"
                  cy="60"
                  r="52"
                  fill="none"
                  pathLength="100"
                />
              </svg>
              <div class="countdown__ring-center">
                <span class="countdown-num" id="countdown-num">3</span>
              </div>
            </div>
            <p class="countdown__unit" data-i18n="countdown_seconds_label">seconds</p>
          </div>
          <div class="countdown__pill">
            <span class="countdown__pill-prefix" data-i18n="countdown_will_start_prefix">Will start from</span>
            <span class="countdown__pill-divider" aria-hidden="true"></span>
            <span class="countdown__pill-time" id="countdown-pill-time">0:00</span>
          </div>
        </div>
      </div>
    </div>

    <audio id="player" preload="none" playsinline></audio>
    <script type="module" src="assets/js/app.js"></script>
  </body>
</html>
