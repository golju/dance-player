<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <title>Dance Player — for classes</title>
    <meta
      name="description"
      content="Pick a local audio file, optional countdown, and start from a fixed second."
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="assets/icons/icon-512.png" />
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#2563eb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Dance Player" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="stylesheet" href="assets/styles/main.css" />
  </head>
  <body>
    <div class="shell">
      <header class="brand">
        <div class="brand-top">
          <div class="brand-copy">
            <div class="brand-name" data-i18n="brand_name">Dance Player</div>
          </div>
          <div class="lang-wrap">
            <select
              id="lang-select"
              class="lang-select j-lang-select"
              autocomplete="off"
              data-i18n-attr="aria-label:lang_aria"
            >
              <option value="en">English</option>
              <option value="el">Ελληνικά</option>
              <option value="ru">Русский</option>
            </select>
          </div>
        </div>
      </header>

      <main class="card">
        <section class="track-panel" data-i18n-attr="aria-label:track_panel_aria">
          <div class="track-panel__hero">
            <input
              id="audio-file"
              type="file"
              accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.webm,.flac"
              data-i18n-attr="aria-label:pick_file_aria"
            />
            <div class="track-panel__art" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z" />
              </svg>
            </div>
            <div class="track-panel__info">
              <div class="track-panel__name" id="track-name"></div>
              <div class="track-panel__meta tabular" id="track-meta"></div>
            </div>
            <button
              type="button"
              class="btn-secondary btn-with-ico track-panel__change"
              id="pick-file-btn"
              data-i18n-attr="aria-label:pick_file_button_aria"
            >
              <svg
                class="btn-ico"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M3 7V5a2 2 0 012-2h3l2 2h7a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V7z" />
              </svg>
              <span data-i18n="pick_file">Change</span>
            </button>
          </div>

          <div class="transport transport--idle" id="transport">
            <div class="transport-scrub">
              <span id="time-current" class="transport-time tabular">0:00</span>
              <div class="transport-track-shell">
                <div
                  class="transport-track"
                  id="transport-track"
                  role="slider"
                  tabindex="-1"
                  style="--transport-pct: 0%"
                  data-i18n-attr="aria-label:transport_track_aria"
                  aria-valuemin="0"
                  aria-valuemax="100"
                  aria-valuenow="0"
                  aria-valuetext=""
                >
                  <div class="transport-bar-rail">
                    <div class="transport-bar" aria-hidden="true">
                      <div class="transport-fill" id="transport-fill"></div>
                    </div>
                    <span class="transport-thumb" aria-hidden="true"></span>
                  </div>
                </div>
              </div>
              <span id="time-duration" class="transport-time tabular">0:00</span>
            </div>
            <div class="transport-actions transport-actions--compact">
              <div class="transport-actions__seek">
                <div class="transport-actions__cluster transport-actions__cluster--left">
                  <button
                    type="button"
                    class="btn-tiny btn-tiny--seek"
                    id="btn-seek-back"
                    disabled
                    data-i18n-attr="aria-label:seek_back_aria"
                  >
                    <span class="btn-tiny__delta tabular" data-i18n="seek_back_short">-5</span>
                  </button>
                </div>
                <button type="button" class="btn-tiny btn-tiny--main btn-play-pause" id="btn-play-pause" disabled data-mode="play">
                  <span class="btn-play-pause__face btn-play-pause__face--play">
                    <svg
                      class="btn-ico btn-ico--play"
                      width="24"
                      height="24"
                      viewBox="0 0 24 24"
                      fill="currentColor"
                      aria-hidden="true"
                    >
                      <path d="M8 5v14l11-7L8 5z" />
                    </svg>
                  </span>
                  <span class="btn-play-pause__face btn-play-pause__face--pause">
                    <svg
                      class="btn-ico"
                      width="22"
                      height="22"
                      viewBox="0 0 24 24"
                      fill="currentColor"
                      aria-hidden="true"
                    >
                      <rect x="8" y="5" width="3" height="14" rx="1.5" />
                      <rect x="13" y="5" width="3" height="14" rx="1.5" />
                    </svg>
                  </span>
                </button>
                <div class="transport-actions__cluster transport-actions__cluster--right">
                  <button
                    type="button"
                    class="btn-tiny btn-tiny--seek"
                    id="btn-seek-fwd"
                    disabled
                    data-i18n-attr="aria-label:seek_fwd_aria"
                  >
                    <span class="btn-tiny__delta tabular" data-i18n="seek_fwd_short">+5</span>
                  </button>
                  <button type="button" class="btn-tiny btn-tiny--stop" id="btn-stop" data-i18n-attr="aria-label:btn_stop">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                      <rect x="7" y="7" width="10" height="10" rx="1.5" />
                    </svg>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </section>

        <div class="field row-2">
          <label class="field-label row-2__label" for="time-roller-scroll" data-i18n="field_start_sec">Start at (sec)</label>
          <label class="field-label row-2__label" for="delay-slider">
            <span class="field-label__text">
              <span data-i18n="delay_label_title">Countdown before track</span
              ><span class="field-label__colon" aria-hidden="true">: </span
              ><span id="delay-value" class="field-label__value">none</span>
            </span>
          </label>
          <div class="row-2__body row-2__body--start">
            <div
              class="start-time-roller"
              id="start-time-roller"
              role="group"
              aria-valuemin="0"
              aria-valuemax="3600"
              aria-valuenow="0"
              aria-valuetext="0:00"
              data-i18n-attr="aria-label:field_start_sec"
            >
              <div class="time-roller-readout-sr tabular" id="time-roller-readout-sr">0:00</div>
              <div class="time-roller-frame" id="time-roller-frame">
                <div class="time-roller-window">
                  <div class="time-roller-scroll" id="time-roller-scroll" tabindex="0" aria-hidden="true">
                    <div class="time-roller-spacer" id="time-roller-spacer" aria-hidden="true"></div>
                  </div>
                  <div class="time-roller-stack" aria-hidden="true">
                    <div class="time-roller-stack-row time-roller-stack-row--prev tabular" id="time-roller-prev"></div>
                    <div class="time-roller-stack-row time-roller-stack-row--live tabular" id="time-roller-live">0:00</div>
                    <div class="time-roller-stack-row time-roller-stack-row--next tabular" id="time-roller-next"></div>
                  </div>
                </div>
              </div>
              <input
                id="start-sec"
                class="num-input num-input--start-fallback"
                type="text"
                inputmode="text"
                autocomplete="off"
                value="0"
                tabindex="-1"
                aria-hidden="true"
                data-i18n-attr="title:start_manual_input_title"
              />
            </div>
          </div>
          <div class="row-2__body row-2__body--delay">
            <div class="range-wrap range-wrap--paired">
              <input id="delay-slider" type="range" min="0" max="10" step="1" value="0" />
            </div>
          </div>
          <div class="row-2__foot row-2__foot--start time-roller-range tabular" id="time-roller-range">
            <span>0:00</span><span class="time-roller-range-sep"> — </span><span id="time-roller-max">60:00</span>
          </div>
          <div class="row-2__foot row-2__foot--delay">
            <div class="range-labels range-labels--paired">
              <span>0</span><span data-i18n="range_label_max">10 sec</span>
            </div>
          </div>
        </div>
      </main>

      <div class="countdown countdown--stage">
        <div
          class="countdown-num countdown-hint"
          id="countdown-num"
          aria-live="polite"
          aria-atomic="true"
        >
          After you start — countdown
        </div>
      </div>
    </div>

    <audio id="player" preload="none" playsinline></audio>
    <script type="module" src="assets/js/app.js"></script>
  </body>
</html>
