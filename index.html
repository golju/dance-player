<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <title>Dance Player — for classes</title>
    <meta
      name="description"
      content="Pick a local audio file, optional countdown, and start from a fixed second."
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="assets/icons/icon-512.png" />
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#2563eb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Dance Player" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="stylesheet" href="assets/styles/main.css" />
  </head>
  <body>
    <div class="shell">
      <header class="brand">
        <div class="brand-top">
          <div class="brand-copy">
            <div class="brand-name" data-i18n="brand_name">Dance Player</div>
            <p class="brand-tag" data-i18n="brand_tag">
              Local file · delay · start at a chosen second · scrub the progress bar
            </p>
          </div>
          <div class="lang-wrap">
            <select
              id="lang-select"
              class="lang-select j-lang-select"
              autocomplete="off"
              data-i18n-attr="aria-label:lang_aria"
            >
              <option value="en">English</option>
              <option value="el">Ελληνικά</option>
              <option value="ru">Русский</option>
            </select>
          </div>
        </div>
      </header>

      <main class="card">
        <div class="field">
          <label class="field-label" for="audio-file" data-i18n="field_track">Track</label>
          <div class="file-row">
            <input id="audio-file" type="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.webm,.flac" />
            <button type="button" class="btn-secondary btn-with-ico" id="pick-file-btn">
              <svg
                class="btn-ico"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M9 18V5l12-2v13" />
                <circle cx="6" cy="18" r="3" />
                <circle cx="18" cy="16" r="3" />
              </svg>
              <span data-i18n="pick_file">Choose file</span>
            </button>
            <span class="track-name" id="track-name"></span>
          </div>
        </div>

        <div class="field row-2">
          <label class="field-label row-2__label" for="time-roller-scroll" data-i18n="field_start_sec">Start at (sec)</label>
          <label class="field-label row-2__label" for="delay-slider">
            <span class="field-label__text">
              <span data-i18n="delay_label_title">Countdown before track</span
              ><span class="field-label__colon" aria-hidden="true">: </span
              ><span id="delay-value" class="field-label__value">none</span>
            </span>
          </label>
          <div class="row-2__body row-2__body--start">
            <div
              class="start-time-roller"
              id="start-time-roller"
              role="group"
              aria-valuemin="0"
              aria-valuemax="3600"
              aria-valuenow="0"
              aria-valuetext="0:00"
              data-i18n-attr="aria-label:field_start_sec"
            >
              <div class="time-roller-readout-sr tabular" id="time-roller-readout-sr">0:00</div>
              <div class="time-roller-frame" id="time-roller-frame">
                <div class="time-roller-window">
                  <div class="time-roller-scroll" id="time-roller-scroll" tabindex="0" aria-hidden="true">
                    <div class="time-roller-spacer" id="time-roller-spacer" aria-hidden="true"></div>
                  </div>
                  <div class="time-roller-stack" aria-hidden="true">
                    <div class="time-roller-stack-row time-roller-stack-row--prev tabular" id="time-roller-prev"></div>
                    <div class="time-roller-stack-row time-roller-stack-row--live tabular" id="time-roller-live">0:00</div>
                    <div class="time-roller-stack-row time-roller-stack-row--next tabular" id="time-roller-next"></div>
                  </div>
                </div>
              </div>
              <input
                id="start-sec"
                class="num-input num-input--start-fallback"
                type="text"
                inputmode="text"
                autocomplete="off"
                value="0"
                tabindex="-1"
                aria-hidden="true"
                data-i18n-attr="title:start_manual_input_title"
              />
            </div>
          </div>
          <div class="row-2__body row-2__body--delay">
            <div class="range-wrap range-wrap--paired">
              <input id="delay-slider" type="range" min="0" max="10" step="1" value="0" />
            </div>
          </div>
          <div class="row-2__foot row-2__foot--start time-roller-range tabular" id="time-roller-range">
            <span>0:00</span><span class="time-roller-range-sep"> — </span><span id="time-roller-max">60:00</span>
          </div>
          <div class="row-2__foot row-2__foot--delay">
            <div class="range-labels range-labels--paired">
              <span>0</span><span data-i18n="range_label_max">10 sec</span>
            </div>
          </div>
        </div>

        <div class="actions">
          <button type="button" class="btn-play btn-with-ico" id="btn-play" disabled>
            <svg
              class="btn-ico btn-ico--play"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="currentColor"
              aria-hidden="true"
            >
              <path d="M8 5v14l11-7L8 5z" />
            </svg>
            <span data-i18n="btn_play">Play</span>
          </button>
          <button type="button" class="btn-pause btn-with-ico" id="btn-pause" disabled>
            <svg
              class="btn-ico"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="currentColor"
              aria-hidden="true"
            >
              <path d="M7 5h3v14H7V5zm7 0h3v14h-3V5z" />
            </svg>
            <span data-i18n="btn_pause">Pause</span>
          </button>
          <button type="button" class="btn-stop btn-with-ico" id="btn-stop">
            <svg
              class="btn-ico"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="currentColor"
              aria-hidden="true"
            >
              <rect x="6" y="6" width="12" height="12" rx="2" />
            </svg>
            <span data-i18n="btn_stop">Stop</span>
          </button>
        </div>

        <div class="transport" id="transport" hidden>
          <div
            class="transport-track"
            id="transport-track"
            role="slider"
            tabindex="0"
            data-i18n-attr="aria-label:transport_track_aria"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
            aria-valuetext=""
          >
            <div class="transport-bar" aria-hidden="true">
              <div class="transport-fill" id="transport-fill"></div>
            </div>
          </div>
          <div class="transport-times">
            <span id="time-current" class="tabular">0:00</span>
            <span class="transport-sep">/</span>
            <span id="time-duration" class="tabular">0:00</span>
          </div>
        </div>
      </main>

      <div class="countdown countdown--stage">
        <div
          class="countdown-num countdown-hint"
          id="countdown-num"
          aria-live="polite"
          aria-atomic="true"
        >
          After you start — countdown
        </div>
      </div>
    </div>

    <audio id="player" preload="none" playsinline></audio>
    <script type="module" src="assets/js/app.js"></script>
  </body>
</html>
